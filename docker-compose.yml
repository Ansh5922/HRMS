services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hrms_postgres
    environment:
      POSTGRES_DB: hrms_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    container_name: hrms_minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  backend-go:
    build: ./backend-go
    container_name: hrms_go
    ports:
      - '8080:8080'
    env_file: ./backend-go/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-ai:
    build: ./backend-ai
    container_name: hrms_ai
    ports:
      - '8001:8001'
    env_file: ./backend-ai/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
